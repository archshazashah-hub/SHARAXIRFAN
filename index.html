<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irfan & Sharafina</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f7efe3;
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100svh;
}

.cover {
  position: relative;
  width: min(100vw, 66.6667svh);
  aspect-ratio: 2 / 3;
}

.cover img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.open {
  position: absolute;
  bottom: 4%;
  left: 25%;
  width: 50%;
  height: 9%;
  border: none;
  background: transparent;
  cursor: pointer;
}

.music {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 5;
  border: 1px solid #b78a50;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  background: #fffaf2;
  color: #65472d;
  font-size: 20px;
}
</style>
</head>

<body>

<audio id="music"
src="./assets/background-music.mp3"
loop preload="auto"></audio>

<button class="music" id="musicButton"
onclick="toggleMusic()">♫</button>

<div class="cover">

<img
src="./assets/invitation-opener.png"
alt="Irfan and Sharafina Invitation"
onerror="this.alt='Invitation image not found. Check assets folder and filename.'"
>

<button class="open" onclick="openInvitation()"
aria-label="Tap to open invitation"></button>

</div>

<script>
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

const canvaLink =
"https://sharaxirfanengagement.my.canva.site/engagement-invitation-2026";

async function toggleMusic() {
  if (music.paused) {
    try {
      await music.play();
      musicButton.innerHTML = "♫";
    } catch (error) {
      alert("Please check that background-music.mp3 is uploaded correctly.");
    }
  } else {
    music.pause();
    musicButton.innerHTML = "♪";
  }
}

function openInvitation() {
  // Open Canva immediately from the visitor's tap.
  window.open(canvaLink, "_blank");

  // Start music from the same visitor interaction.
  music.play().then(() => {
    musicButton.innerHTML = "♫";
  }).catch(() => {
    alert("Please tap the music button to start the music.");
  });
}
</script>

</body>
</html>
