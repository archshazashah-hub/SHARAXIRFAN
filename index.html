
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#f7efe3">

<title>Irfan & Sharafina | Engagement Invitation</title>

<meta name="description"
content="You are invited to celebrate the engagement of Irfan and Sharafina.">

<!-- Canva connection optimisation -->
<link rel="preconnect" href="https://canva.com">
<link rel="dns-prefetch" href="https://canva.com">

<style>

/* GENERAL SETTINGS */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  background: #f7efe3;
}

body {
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  background: #f7efe3;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

/* INVITATION COVER */

.cover {
  position: relative;

  width: 100%;
  max-width: 680px;

  min-height: 100vh;
  min-height: 100svh;

  margin: auto;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.cover img {
  display: block;

  width: 100%;
  height: 100vh;
  height: 100svh;

  object-fit: contain;

  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* TAP TO OPEN BUTTON */

.open {
  position: absolute;

  left: 25%;
  bottom: 5%;

  width: 50%;
  height: 9%;

  z-index: 10;

  display: block;

  background: transparent;

  border: none;

  cursor: pointer;

  text-decoration: none;

  -webkit-tap-highlight-color: transparent;
}

.open:focus-visible {
  outline: 2px solid #b78a50;
  outline-offset: 3px;
}

/* MUSIC BUTTON */

.music-button {
  position: fixed;

  top: 18px;
  right: 18px;

  z-index: 20;

  width: 46px;
  height: 46px;

  border-radius: 50%;

  border: 1px solid #b78a50;

  background: rgba(255, 250, 242, 0.95);

  color: #65472d;

  font-size: 21px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow: 0 3px 12px rgba(88, 57, 25, 0.12);

  -webkit-tap-highlight-color: transparent;
}

.music-button:active {
  transform: scale(0.94);
}

/* DESKTOP DISPLAY */

@media (min-width: 681px) {

  body {
    display: flex;
    justify-content: center;
  }

  .cover {
    width: 100%;
  }

}

/* SMALL MOBILE DISPLAY */

@media (max-width: 380px) {

  .music-button {
    width: 42px;
    height: 42px;
    top: 12px;
    right: 12px;
  }

}

</style>

</head>

<body>

<!-- BACKGROUND MUSIC -->

<audio
  id="music"
  src="./assets/background-music.mp3"
  preload="auto"
  loop>
</audio>


<!-- MUSIC CONTROL BUTTON -->

<button
  class="music-button"
  id="musicButton"
  type="button"
  aria-label="Play background music"
  onclick="toggleMusic()">

  ♪

</button>


<!-- MAIN INVITATION COVER -->

<main class="cover">

  <!-- ORIGINAL INVITATION IMAGE -->

  <img
    src="./assets/invitation-opener.png"
    alt="Irfan and Sharafina engagement invitation"
  >


  <!-- NATIVE CANVA LINK -->

  <a
    class="open"

    href="https://sharaxirfanengagement.my.canva.site/engagement-invitation-2026"

    target="_blank"

    rel="noopener noreferrer"

    onclick="playMusic()"

    aria-label="Tap to open engagement invitation">

  </a>

</main>


<!-- JAVASCRIPT -->

<script>

/* GET MUSIC ELEMENT */

const music = document.getElementById("music");

const musicButton =
document.getElementById("musicButton");


/* PLAY MUSIC */

function playMusic() {

  music.play()
    .then(() => {

      musicButton.innerHTML = "♫";

      musicButton.setAttribute(
        "aria-label",
        "Pause background music"
      );

    })
    .catch((error) => {

      console.log("Music playback requires interaction.");

    });

}


/* PLAY AND PAUSE CONTROL */

async function toggleMusic() {

  if (music.paused) {

    try {

      await music.play();

      musicButton.innerHTML = "♫";

      musicButton.setAttribute(
        "aria-label",
        "Pause background music"
      );

    }

    catch (error) {

      console.log("Unable to play music:", error);

    }

  }

  else {

    music.pause();

    musicButton.innerHTML = "♪";

    musicButton.setAttribute(
      "aria-label",
      "Play background music"
    );

  }

}


/* UPDATE MUSIC ICON */

music.addEventListener("play", () => {

  musicButton.innerHTML = "♫";

});

music.addEventListener("pause", () => {

  musicButton.innerHTML = "♪";

});

</script>

</body>

</html>
